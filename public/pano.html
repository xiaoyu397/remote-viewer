<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>360° 全景预览器</title><style>*{box-sizing:border-box}body{margin:0;background:#101217;color:#eee;font:14px system-ui,sans-serif}main{height:100dvh;display:flex;flex-direction:column}header{padding:16px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#191d25}strong{font-size:19px;margin-right:auto}button,label.upload{background:#303846;color:white;border:1px solid #455062;border-radius:8px;padding:9px 14px;cursor:pointer}label.upload{background:#2563eb;border-color:#2563eb}#view{position:relative;flex:1;min-height:0;overflow:hidden;background:#171c24}canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}#hint{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;color:#abb5c5;line-height:2}#hint b{font-size:24px;color:white}footer{padding:15px 20px;display:flex;gap:15px;align-items:center;flex-wrap:wrap;background:#191d25}input[type=range]{accent-color:#60a5fa;flex:1;min-width:130px;max-width:440px}#status{color:#aab5c4;font-size:12px}#angles{margin-left:auto;color:#aab5c4;font-variant-numeric:tabular-nums}</style><main id="app"><header><strong>◉ 360° 全景预览器 V2</strong><label class="upload">打开图片<input id="file" type="file" accept="image/*,.jpg,.jpeg,.jfif,.png,.webp,.bmp,.gif,.avif,.ico,.tif,.tiff,.heic,.heif" hidden></label><button id="reset">重置视角</button><button id="full">全屏</button></header><div id="view"><canvas id="canvas"></canvas><div id="hint"><b>拖入全景图片</b><span>或点击「打开图片」</span><span>JPG · PNG · WebP · BMP · GIF · AVIF<br>推荐 2:1 等距柱状投影图片</span></div></div><footer><label for="fov">垂直视场角 FOV</label><input id="fov" type="range" min="30" max="120" value="75"><output id="value">75°</output><span id="angles">Yaw 0° · Pitch 0°</span><span id="status">拖动旋转 · 滚轮缩放 · 双指缩放</span></footer></main><script>
const $=id=>document.getElementById(id),c=$('canvas'),gl=c.getContext('webgl',{alpha:false}), hint=$('hint');let yaw=0,pitch=0,fov=75,loaded=false,tex,program;const rad=Math.PI/180,clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
function init(){if(!gl){hint.textContent='此浏览器不支持 WebGL，请使用新版 Chrome、Edge 或 Safari。';return}function shader(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,'attribute vec2 p; varying vec2 uv; void main(){uv=p;gl_Position=vec4(p,0.,1.);}'));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,`precision highp float; varying vec2 uv; uniform sampler2D img; uniform float yaw,pitch,scale,aspect; void main(){vec3 d=normalize(vec3(uv.x*aspect*scale,uv.y*scale,1.));float cp=cos(pitch),sp=sin(pitch);d=vec3(d.x,cp*d.y+sp*d.z,-sp*d.y+cp*d.z);float cy=cos(yaw),sy=sin(yaw);d=vec3(cy*d.x+sy*d.z,d.y,-sy*d.x+cy*d.z);vec2 t=vec2(fract(atan(d.x,d.z)/6.28318530718+.5),.5-asin(clamp(d.y,-1.,1.))/3.14159265359);gl_FragColor=texture2D(img,t);}`));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);let p=gl.getAttribLocation(program,'p');gl.enableVertexAttribArray(p);gl.vertexAttribPointer(p,2,gl.FLOAT,false,0,0);tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);for(let [k,v] of [[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]])gl.texParameteri(gl.TEXTURE_2D,k,v);draw()}
function draw(){ $('fov').value=fov;$('value').textContent=Math.round(fov)+'°';$('angles').textContent=`Yaw ${Math.round(yaw)}° · Pitch ${Math.round(pitch)}°`;if(!gl||!program)return;let r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=Math.max(1,Math.round(r.width*d));c.height=Math.max(1,Math.round(r.height*d));gl.viewport(0,0,c.width,c.height);gl.clearColor(.09,.11,.15,1);gl.clear(gl.COLOR_BUFFER_BIT);if(!loaded)return;for(let [k,v] of Object.entries({yaw:yaw*rad,pitch:pitch*rad,scale:Math.tan(fov*rad/2),aspect:c.width/c.height}))gl.uniform1f(gl.getUniformLocation(program,k),v);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}
let loadId=0;
async function load(file){if(!file||!gl)return;const id=++loadId;let url=URL.createObjectURL(file),candidate=null; $('status').textContent='正在解码：'+file.name;try{let im=new Image();im.src=url;try{await im.decode()}catch(e){throw Error('浏览器无法解码此格式或文件已损坏；TIFF、HEIC 等可先转为 PNG/JPG')}if(id!==loadId)return;let w=im.naturalWidth,h=im.naturalHeight,max=gl.getParameter(gl.MAX_TEXTURE_SIZE),s=Math.min(1,max/w,max/h,Math.sqrt(64000000/(w*h))),rw=0,rh=0,ok=false; if(!w||!h)throw Error('图片尺寸无效'); for(let attempt=0;attempt<6;attempt++,s*=.5){let source=document.createElement('canvas');rw=source.width=Math.max(1,Math.floor(w*s));rh=source.height=Math.max(1,Math.floor(h*s));try{let ctx=source.getContext('2d');if(!ctx)throw Error('画布内存不足');ctx.fillStyle='#000';ctx.fillRect(0,0,rw,rh);ctx.drawImage(im,0,0,rw,rh);if(gl.isContextLost())throw Error('WebGL 上下文丢失，请刷新页面');for(let i=0;i<8&&gl.getError()!==gl.NO_ERROR;i++){}candidate=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,candidate);for(let [k,v] of [[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]])gl.texParameteri(gl.TEXTURE_2D,k,v);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,source);ok=gl.getError()===gl.NO_ERROR&&!gl.isContextLost();}catch(e){ok=false}finally{source.width=source.height=1}if(ok)break;if(candidate)gl.deleteTexture(candidate);candidate=null;if(gl.isContextLost())break}if(!ok)throw Error('显卡纹理或内存不足，请尝试较小尺寸图片或刷新页面');gl.deleteTexture(tex);tex=candidate;candidate=null;loaded=true;hint.style.display='none';yaw=pitch=0;fov=75;$('status').textContent=`${file.name} · 原图 ${w} × ${h} · 渲染 ${rw} × ${rh}`+(Math.abs(w/h-2)>.03?' · 非 2:1，可能变形':'')+(s<1?' · 已自动降采样':'');draw()}catch(e){if(id===loadId){if(candidate)gl.deleteTexture(candidate);gl.bindTexture(gl.TEXTURE_2D,tex);$('status').textContent='无法读取图片：'+e.message;draw()}}finally{URL.revokeObjectURL(url)}}
$('file').onchange=e=>{load(e.target.files[0]);e.target.value=''};let view=$('view');view.ondragover=e=>e.preventDefault();view.ondrop=e=>{e.preventDefault();load(e.dataTransfer.files[0])};$('fov').oninput=e=>{fov=+e.target.value;draw()};$('reset').onclick=()=>{yaw=pitch=0;fov=75;draw()};$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('app').requestFullscreen()}catch(e){$('status').textContent='当前浏览器不支持全屏'}};document.addEventListener('fullscreenchange',()=>{$('full').textContent=document.fullscreenElement?'退出全屏':'全屏';draw()});c.addEventListener('wheel',e=>{e.preventDefault();fov=clamp(fov+Math.sign(e.deltaY)*3,30,120);draw()},{passive:false});let pts=new Map();c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY])};c.onpointermove=e=>{if(!pts.has(e.pointerId))return;let old=pts.get(e.pointerId),now=[e.clientX,e.clientY];if(pts.size===2){let other=[...pts.entries()].find(([id])=>id!==e.pointerId)[1],a=Math.hypot(old[0]-other[0],old[1]-other[1]),b=Math.hypot(now[0]-other[0],now[1]-other[1]);if(b>0)fov=clamp(fov*a/b,30,120)}else if(pts.size===1){let k=fov/Math.max(1,c.clientHeight);yaw=((yaw-(now[0]-old[0])*k+540)%360)-180;pitch=clamp(pitch+(now[1]-old[1])*k,-90,90)}pts.set(e.pointerId,now);draw()};c.onpointerup=c.onpointercancel=c.onlostpointercapture=e=>pts.delete(e.pointerId);new ResizeObserver(draw).observe(view);try{init()}catch(e){hint.textContent='初始化失败：'+e.message}
window.addEventListener('message',async e=>{if(e.origin!==location.origin||e.source!==parent||e.data?.type!=='pano')return;try{const u=new URL(e.data.url,location.href);if(u.origin!==location.origin||!u.pathname.startsWith('/model/'))throw Error('Invalid URL');const r=await fetch(u);if(!r.ok)throw Error('HTTP '+r.status);await load(new File([await r.blob()],e.data.name));}catch(err){$('status').textContent=err.message;}});</script></html>
