<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remote Viewer V4.0</title><style>
*{box-sizing:border-box}body{margin:0;background:#11151c;color:#e4e8ef;font:14px system-ui;display:flex;height:100dvh}aside{width:310px;max-width:42vw;background:#191f29;border-right:1px solid #343d4c;display:flex;flex-direction:column;padding:16px;gap:12px}h2{margin:0;font-size:20px}small,#status{color:#aab6c9}button,input{font:inherit;color:inherit;background:#252e3c;border:1px solid #3c495c;border-radius:6px;padding:8px}button{cursor:pointer}button:hover{background:#35445a}#files{overflow:auto;flex:1}#files button{width:100%;text-align:left;margin:3px 0;overflow-wrap:anywhere}main{flex:1;min-width:0;display:flex;flex-direction:column}header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;background:#191f29}#view{flex:1;min-height:0;position:relative}canvas{display:block;width:100%;height:100%;touch-action:none}#status{padding:8px;overflow-wrap:anywhere}#where{overflow-wrap:anywhere}input[type=range]{width:100px}#search{width:100%}[hidden]{display:none!important}body{background:#1e1e1e;color:#ccc}aside{background:#252526;padding:10px 0;gap:8px;border-color:#333;resize:horizontal;overflow:auto;min-width:180px}aside h2,aside small,aside>div:not(#files),aside>input{margin:0 10px}aside h2{font-size:12px;text-transform:uppercase;letter-spacing:1px}#search{width:calc(100% - 20px)}#files button{border:0;border-radius:0;background:transparent;margin:0;padding-top:4px;padding-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}#files button:hover,#files button.selected{background:#37373d}#tabs{display:flex;background:#252526;overflow:auto;min-height:34px}#tabs button{white-space:nowrap;border-radius:0;border:0;border-right:1px solid #333;background:#2d2d2d}#tabs button.active{background:#1e1e1e;color:white;border-top:2px solid #007acc}#filebar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#252526}#filename{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#preview{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;position:relative}#preview img,#preview video{max-width:100%;max-height:100%;object-fit:contain}#preview pre{align-self:stretch;width:100%;margin:0;padding:16px;overflow:auto;font:13px/1.65 monospace;white-space:pre;tab-size:4}#preview iframe{border:0;width:100%;height:100%}#status{background:#007acc;color:white;font-size:12px}button,input{background:#303030;border-color:#444}header{background:#252526}</style><body><aside><h2>资源管理器</h2><small>远程文件 · 只读</small><div><button id="refresh">刷新</button> <button id="collapse">折叠全部</button></div><input id="search" placeholder="筛选已展开文件"><div id="files"></div></aside><main><div id="tabs"></div><div id="filebar"><span id="filename">请选择文件</span><button id="pano" hidden>360° 全景</button><button id="download" hidden>下载</button></div><header id="gsbar" hidden><button id="reset">原点 (0,0,0)</button><button id="global">全局视角</button><button id="fps">第一人称</button><button id="flip">翻转模型</button><button id="full">全屏</button><label>FOV <input id="fov" type="range" min="20" max="120" value="90"> <span id="angle">90°</span></label><label>速度 <input id="speed" type="range" min="0.1" max="20" step="0.1" value="1"> <span id="speedval">1.0</span></label><span id="mode"></span></header><div id="view" hidden></div><div id="preview">从左侧目录选择文件</div><div id="posebar" hidden style="padding:8px">相机 XYZ: <span id="pose"></span> · WASD 移动 / Q 下 E 上</div><div id="status">请选择左侧模型。左键旋转 / WASDQE 移动 / Shift 加速 / 滚轮 FOV</div></main><script type="module" src="/app.js"></script></body></html>
