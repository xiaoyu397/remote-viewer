<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Remote Viewer V4.0</title>
  <link rel="stylesheet" href="./viewer.css">
</head>
<body>
  <header class="app-header">
    <button id="toggle-files" class="icon-button" aria-label="切换文件目录" title="切换文件目录" aria-controls="sidebar" aria-expanded="true"><span class="icon sidebar-icon"></span></button>
    <span class="icon repo-icon"></span><strong>Remote Viewer</strong>
  </header>
  <div id="workspace">
    <aside id="sidebar" aria-label="文件目录">
      <div class="sidebar-heading">
        <h2>文件</h2>
        <button id="refresh" class="icon-button" title="刷新" aria-label="刷新"><span class="icon refresh-icon"></span></button>
        <button id="collapse" class="icon-button" title="折叠全部" aria-label="折叠全部"><span class="icon collapse-icon"></span></button>
      </div>
      <label class="filter"><span class="icon search-icon"></span><input id="search" type="search" aria-label="筛选已展开文件" placeholder="筛选已展开文件"></label>
      <div id="files"></div>
    </aside>
    <div id="splitter" role="separator" tabindex="0" aria-label="文件目录宽度" aria-orientation="vertical" aria-controls="sidebar" title="拖动调整目录宽度，也可使用左右方向键"></div>
    <main>
      <nav id="tabs" aria-label="已打开文件"></nav>
      <section class="viewer-frame" aria-labelledby="filename">
        <div id="filebar">
          <span class="icon file-icon"></span><strong id="filename">文件预览</strong>
          <label id="markdown-control" hidden><input id="markdown-render" type="checkbox" autocomplete="off"> 渲染 Markdown</label>
          <button id="pano" hidden>360° 全景</button><button id="download" hidden>下载</button>
        </div>
        <div id="gsbar" hidden>
          <button id="reset">原点 (0,0,0)</button><button id="global">全局视角</button><button id="fps">第一人称</button>
          <button id="flip">翻转模型</button><button id="full">全屏</button>
          <label>FOV <input id="fov" type="range" min="20" max="120" value="90"> <span id="angle">90°</span></label>
          <label>速度 <input id="speed" type="range" min="0.1" max="20" step="0.1" value="1"> <span id="speedval">1.0</span></label>
          <span id="mode"></span>
        </div>
        <div id="view" hidden></div>
        <div id="preview">从左侧目录选择文件</div>
        <div id="posebar" hidden>相机 XYZ: <span id="pose"></span> · WASD 移动 / Q 下 E 上</div>
      </section>
      <div id="status">就绪</div>
    </main>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
